data:
  raw_dir:      data/raw/
  parsed_dir:   data/parsed/
  targets_dir:  data/parsed/targets/
  dataset_dir:  data/dataset/
  train_split:  0.7
  val_split:    0.15
  test_split:   0.15
extractor:
  k_hops:             3
  seed:               42
  max_pos_per_target: 200
  vf3_bin: vf3_cpp/build/prog
  lib_dir: vf3_cpp/examples/lib
  negatives:
    random_per_pos:    1.5
    partial_per_pos:   0.5
    mutation_per_pos:  0.25
    others_per_pos:    0.25
  neg_pos_ratio:      2
model:
  in_channels:        5
  hidden_channels:    128
  num_relations:      22
  num_bases:          8
  num_layers:         2
training:
  epochs:         1000
  batch_size:     64
  learning_rate:  0.001
  weight_decay:   0.0001
  checkpoint_metric: f1
  grad_clip_norm:   1.0
  warmup_epochs:    5
  scheduler:
    enabled:        true
    type:           plateau
    factor:         0.5
    patience:       15
    min_lr:         0.00001
    threshold:      0.001
  early_stopping:
    enabled:        true
    patience:       60
    min_delta:      0.0005
inference:
  vf3_threshold:      0.90
  checkpoint:         checkpoints/best_model.pt